name: astrbot_plugin_media_analysis
display_name: 语音视频分析
desc: >-
  为 AstrBot 提供 media_analyze 工具，分析当前或引用消息中的语音、视频和 GIF，支持群文件。
  工具返回受理或失败信封，后台尝试发送结果；实际送达不保证。视频优先尝试原生分析，
  按参数和模型配置决定是否抽帧回退。有效缓存命中时复用结果。
short_desc: 语音、视频与 GIF 后台分析，支持群文件和结果缓存
version: v0.5.2
author: 大肥鱼
repo: "https://github.com/cmdst/astrbot_plugin_media_analysis"
astrbot_version: ">=4.29,<5"
support_platforms:
  - aiocqhttp
