name: astrbot_plugin_media_analysis
display_name: 语音视频分析
desc: >-
  给 LLM 一个工具 media_analyze：把当前消息或引用消息里的语音/视频（含以群文件形式投递的
  mp4/mov/m4a/mp3/wav/amr/silk 等）交给多模态模型。视频主路径是「原生视频直送」——整段视频
  一次调用同时拿画面与声音；视觉模型不可用、视频超门槛压不下去或原生调用失败时，才回退到
  「抽帧 + 独立的图片模型」。返回固定形状的 JSON 信封。解析结果本地缓存带 TTL，同一媒体
  二次引用不再花 token。
short_desc: 视频整段直送多模态模型，抽帧只做回退（支持群文件投递，结果本地缓存）
version: v0.4.0
author: 大肥鱼
repo: "https://github.com/cmdst/astrbot_plugin_media_analysis"
astrbot_version: ">=4.29,<5"
support_platforms:
  - aiocqhttp
